name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不要引入 android-actions/setup-android：它内部会执行 `sdkmanager tools`，
      # 而 Google 已从 SDK 仓库移除 `tools` 包，该步骤必然 exit 1。
      # ubuntu-24.04 镜像自带 android-36 platform、build-tools 36.0.0、NDK 27.3，
      # 唯独缺 player-exo/build.gradle.kts 里写死的 CMake 3.22.1，这里单独补上。
      - name: Install CMake 3.22.1 required by player-exo
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --install "cmake;3.22.1"
          ls "$ANDROID_HOME/cmake"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew 在 git 索引里是 100644，没有可执行位，直接 ./gradlew 会 Permission denied
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # setup-gradle 连解析元数据缓存一起还原，里面会带着「这个包找不到」的负面结论
      # （早先阿里云从美国 IP 访问是 502、Maven Central 是 403，那时确实找不到）。
      # 缓存命中后 Gradle 不再发请求，直接报 not found，哪怕镜像里其实有。
      # 只清元数据，已下载的 jar（modules-2/files-2.1）保留。
      - name: Drop stale Gradle resolution metadata
        run: rm -rf "$GRADLE_USER_HOME"/caches/modules-2/metadata-* "$GRADLE_USER_HOME"/caches/*/resource-at-url*

      # local.properties 未提交，BUGLY_APP_ID / AES_KEY / AES_IV 走空字符串兜底，
      # Android SDK 位置由 ANDROID_HOME 提供，无需 sdk.dir
      - name: Build prodDebug APK
        run: |
          set -o pipefail
          ./gradlew :dy-player:assembleProdDebug --stacktrace 2>&1 | tee gradle-build.log

      # 仅构建失败时跑。Actions 的原始日志必须登录才能下载，但 annotation 是公开可读的，
      # 所以把 Gradle 报错和 runner 到各仓库的可达性都塞进 annotation。
      - name: Report failure details
        if: failure()
        run: |
          P="com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.6/com.google.devtools.ksp.gradle.plugin-2.3.6.pom"
          probe=""
          for base in \
            "https://maven.aliyun.com/repository/public" \
            "https://maven-central.storage-download.googleapis.com/maven2" \
            "https://repo.maven.apache.org/maven2" \
            "https://dl.google.com/dl/android/maven2" ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$base/$P" || echo ERR)
            probe="$probe ${base}=${code}"
          done
          echo "::error title=repo-probe::$probe"
          if [ -f gradle-build.log ]; then
            msg=$(sed -n '/What went wrong/,/^\* Try/p' gradle-build.log \
                  | head -c 1200 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=gradle::$msg"
          fi
          {
            echo "### repo-probe"
            echo '```'
            echo "$probe"
            echo '```'
            echo "### gradle"
            echo '```'
            sed -n '/What went wrong/,/^\* Try/p' gradle-build.log | head -c 3000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DyLike-prodDebug
          path: dy-player/build/outputs/apk/**/*.apk
          if-no-files-found: error
